name = "weltenbummler"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-Speicher (im kostenlosen Workers-Plan verfügbar)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Eigene Subdomain – das "#" entfernen, sobald tyjora.com bei Cloudflare liegt (tut es schon):
# routes = [ { pattern = "weltenbummler.tyjora.com", custom_domain = true } ]
